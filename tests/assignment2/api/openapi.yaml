openapi: 3.0.3
info:
  title: ReqRes REST API
  description: |
    Fake online REST API used in Assignment 2 to demonstrate REST MCP integration.
    The MCP rest-api server is pointed at https://reqres.in/api and these endpoints
    are exercised during the E2E scenario to validate user data before browser automation.
  version: "1.0"
  contact:
    url: https://reqres.in

servers:
  - url: https://reqres.in/api
    description: ReqRes hosted fake API

paths:
  /users:
    get:
      summary: List users (paginated)
      operationId: listUsers
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
              example:
                page: 1
                per_page: 6
                total: 12
                total_pages: 2
                data:
                  - id: 1
                    email: george.bluth@reqres.in
                    first_name: George
                    last_name: Bluth
                    avatar: https://reqres.in/img/faces/1-image.jpg

  /users/{id}:
    get:
      summary: Get a single user by ID
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Single user object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleUserResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties: {}

  /users:
    post:
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              name: morpheus
              job: leader
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"

  /users/{id}:
    put:
      summary: Update a user (full replace)
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"

    delete:
      summary: Delete a user
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deleted (no content)

  /login:
    post:
      summary: Authenticate and receive a token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: eve.holt@reqres.in
              password: cityslicka
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing password or email

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        avatar:
          type: string
          format: uri

    UserListResponse:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"

    SingleUserResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/User"

    CreateUserRequest:
      type: object
      required: [name, job]
      properties:
        name:
          type: string
        job:
          type: string

    CreateUserResponse:
      type: object
      properties:
        name:
          type: string
        job:
          type: string
        id:
          type: string
        createdAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        job:
          type: string

    UpdateUserResponse:
      type: object
      properties:
        name:
          type: string
        job:
          type: string
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
